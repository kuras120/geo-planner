name: build

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pinned tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.5.5
          install: true
          cache: true

      - name: Run verification
        run: mise run ci
