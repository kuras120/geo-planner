[tools]
java = "temurin-25.0.3+9.0.LTS"
node = "24.18.1"

[tasks.install]
description = "Install locked frontend and simulator dependencies plus Chromium"
run = [
  "npm --prefix frontend ci",
  "npm --prefix backend-simulator ci",
  "npm --prefix frontend exec playwright install chromium",
]

[tasks.frontend]
description = "Run the Angular development server"
dir = "frontend"
run = "npm start"

[tasks.storybook]
description = "Run the shared UI workshop"
dir = "frontend"
run = "npm run storybook"

[tasks.simulator]
description = "Build and run the backend contract simulator"
dir = "backend-simulator"
run = "npm run build && npm start"

[tasks.verify]
description = "Run frontend, simulator, and legacy offline quality gates"
run = [
  "npm --prefix backend-simulator run verify",
  "npm --prefix frontend run verify",
  "./scripts/verify.sh",
]
