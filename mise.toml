[tools]
java = "temurin-25.0.3+9.0.LTS"
node = "24.18.1"

[tasks.build-local]
description = "Install backend, frontend and simulator dependencies plus Chromium"
run = [
  "./gradlew :backend:clean",
  "./gradlew :backend:build",
  "npm --prefix frontend install",
  "npm --prefix backend-simulator install",
  "npm --prefix frontend exec playwright install chromium",
]

[tasks.start-frontend]
description = "Run the Angular development server"
dir = "frontend"
run = "npm start"

[tasks.start-backend]
description = "Run the Spring Boot development server"
dir = "backend"
run = "../gradlew :backend:bootRun --console=plain"

[tasks.start-storybook]
description = "Run the shared UI workshop"
dir = "frontend"
run = "npm run storybook"

[tasks.start-simulator]
description = "Run the backend contract simulator"
dir = "backend-simulator"
run = "npm start"

[tasks.verify]
description = "Run frontend, simulator, and legacy offline quality gates"
run = [
  "./gradlew :backend:test",
  "npm --prefix backend-simulator run verify",
  "npm --prefix frontend run verify",
  "./scripts/verify.sh",
]

[tasks.build-release]
description = "Release frontend and backend"
run = [
  "./gradlew :backend:clean",
  "./gradlew :backend:bootJar",
  "npm --prefix frontend run ci",
  "npm --prefix frontend run build"
]
